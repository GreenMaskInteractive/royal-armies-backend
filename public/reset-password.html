<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Royal Armies - An MMOHFT Medieval-Fantasy Strategy Game</title>
    <link rel="icon" type="image/png" href="images/royalarmiesloretool.png">
    <link rel="stylesheet" href="style.css?v=cursor-modal-layer-fix-1">
    <link rel="stylesheet" href="style2.css?v=rain-fable-restore-1">
    <link rel="stylesheet" href="custom-cursor.css">
    <link rel="stylesheet" href="dev-page-navigator.css">
    <style>
        body {
            background: #000;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: var(--ra-layout-vh, 100vh);
            margin: 0;
            text-align: center;
        }
        .reset-box {
            border: 2px solid #d4af37;
            padding: 40px;
            background: rgba(10, 10, 10, 0.95);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            width: 350px;
        }
        .reset-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d4af37;
            color: white;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }
        .reset-box .img-btn {
            background-image: url('images/register_btn.png') !important;
            background-size: 100% 100%;
            background-color: transparent;
            border: none;
            width: 100%;
            height: 50px;
            color: #ffd700;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<script src="rift-viewport-metrics.js?v=universal-viewport-1"></script>
<script src="rift-page-loading-gate.js?v=page-loading-gate-1"></script>
    <div class="reset-box">
        <h1>RESET KEYS</h1>
        <p style="font-size: 0.8rem; margin-bottom: 20px;">ENTER YOUR NEW CREDENTIALS, COMMANDER.</p>

        <input type="password" id="new-password" class="reset-input" placeholder="NEW PASSWORD">
        <input type="password" id="confirm-password" class="reset-input" placeholder="CONFIRM PASSWORD">

        <button type="button" class="img-btn" onclick="executeReset()">
            Confirm
        </button>
    </div>

    <script src="dev-environment.js"></script>
    <script src="dev-page-navigator.js"></script>
    <script src="portal-alerts.js"></script>
    <script>
        async function executeReset() {
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!newPass || newPass !== confirmPass) {
                await showPortalAlert('Passwords do not match or are empty.', 'Password reset');
                return;
            }

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: newPass })
                });

                if (response.ok) {
                    await showPortalAlert('Password changed. You can now login with your new password.', 'Password reset');
                    window.location.href = '/main';
                    return;
                }
                await showPortalAlert('This link has already been used or is invalid.', 'Password reset');
            } catch (err) {
                await showPortalAlert('Could not reach the server. Try again in a moment.', 'Connection error');
            }
        }
    </script>
    <script src="custom-cursor.js?v=desktop-restore-1"></script>
</body>
</html>
