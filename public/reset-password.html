<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Royal Armies | Reset Access Keys</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #000;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .reset-box {
            border: 2px solid #d4af37;
            padding: 40px;
            background: rgba(10, 10, 10, 0.95);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            width: 350px;
        }
        .reset-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d4af37;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="reset-box">
        <h1>RESET KEYS</h1>
        <p style="font-size: 0.8rem; margin-bottom: 20px;">ENTER YOUR NEW CREDENTIALS, COMMANDER.</p>
        
        <input type="password" id="new-password" class="reset-input" placeholder="NEW PASSWORD">
        <input type="password" id="confirm-password" class="reset-input" placeholder="CONFIRM PASSWORD">
        
        <button class="img-btn" onclick="executeReset()" style="margin-top: 20px; width: 100%;">Update Ledger</button>
    </div>

    <script>
        async function executeReset() {
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            // Automatically grab the token from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!newPass || newPass !== confirm) {
                return alert("Passwords do not match or are empty!");
            }

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: newPass })
                });

                if (response.ok) {
                    alert("Access Keys Updated. You may now return to the portal.");
                    window.location.href = "/";
                } else {
                    alert("This reset scroll has expired or is invalid.");
                }
            } catch (err) {
                alert("Nexus Connection Error.");
            }
        }
    </script>
</body>
</html>
