<html lang="en">
<head>

    <title>Royal Armies — Age of War (Trailer Render)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="season/season-age-of-war.flex.css?v=trailer-render-fix-1">
    <style>
    html,
    body.age-of-war-trailer-page {
        margin: 0;
        width: 1408px;
        height: 768px;
        min-width: 1408px;
        min-height: 768px;
        max-width: 1408px;
        max-height: 768px;
        background: #000;
        overflow: hidden;
    }

    .game-opening-prologue.is-trailer-render-mode {
        position: fixed;
        inset: 0;
        width: 1408px;
        height: 768px;
        margin: 0;
    }

    .game-opening-prologue.is-trailer-render-mode .game-opening-prologue-trailer-controls {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
    }

    .game-opening-prologue.is-trailer-render-mode .game-opening-prologue-trailer-player {
        display: block !important;
        visibility: visible !important;
    }

    .game-opening-prologue.is-trailer-render-mode .game-opening-prologue-trailer-player[hidden] {
        display: block !important;
    }

    .game-opening-prologue.is-trailer-render-mode .game-opening-prologue-trailer-stage {
        width: 1408px !important;
        height: 768px !important;
        max-width: 1408px !important;
        max-height: 768px !important;
    }

    .game-opening-prologue.is-trailer-render-mode .game-opening-prologue-trailer-viewport {
        width: 1408px !important;
        height: 768px !important;
    }
    </style>
</head>
<body
    id="royal-armies-ageofwar-trailer-canvas"
    class="age-of-war-trailer-page"

    data-trailer-render="1"
