<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Royal Armies - Age Session (In Development)</title>
    <link rel="stylesheet" href="style.css?v=mailbox-read-popup-wide-2">
    <link rel="stylesheet" href="style2.css?v=membership-nametag-tab-9">
    <link rel="stylesheet" href="mobile-responsive.css?v=choose-class-characters-2">
    <link rel="stylesheet" href="dev-page-navigator.css">
    <link rel="stylesheet" href="custom-cursor.css?v=scrollbar-cursor-2">
</head>
<body id="game-page-canvas" class="game-page-canvas">
<script src="page-route-transition.js?v=route-fade-1"></script>

    <div class="game-page-staging-deck">
        <div class="portal-desktop-nav-stack game-page-nav-stack">
            <div class="portal-nav-commander-identity-row nav-embedded-account-label portal-desktop-nav-only">
                <div class="portal-commander-identity-shell" id="portal-commander-identity-shell">
                    <button type="button" class="portal-commander-new-messages-bar" id="portal-commander-new-messages-bar" hidden aria-live="polite" aria-label="You have new messages. Open messages.">
                        <span class="portal-commander-new-messages-bar-text">You have new messages</span>
                    </button>
                <div class="portal-commander-identity-card" id="portal-commander-identity-card">
                    <div class="portal-commander-identity-card-body portal-commander-identity-trigger"
                        id="portal-commander-identity-trigger"
                        role="button"
                        tabindex="0"
                        aria-expanded="false"
                        aria-controls="portal-desktop-commander-menu"
                        aria-label="Open commander menu"
                        title="Commander menu">
                        <div class="nav-avatar-hub-wrapper">
                            <img id="nav-embedded-avatar-crest" src="images/avatars/commanderprofile01.png" alt="Commander avatar" class="nav-bar-embedded-avatar-thumbnail">
                        </div>
                        <div class="nav-account-identity-cluster">
                            <div class="nav-account-identity-stack">
                                <strong id="logged-user-tag">Loading...</strong>
                            </div>
                            <div id="nav-commander-membership-badge-row" class="commander-membership-badge-row nav-commander-membership-badge-row nav-commander-membership-tab" hidden></div>
                        </div>
                    </div>
                    <div class="portal-commander-identity-menu" id="portal-desktop-commander-menu" role="menu" hidden>
                        <button type="button" class="dropdown-action-item dropdown-action-item-view-profile" role="menuitem" onclick="portalDesktopCommanderMenuAction('view-profile', event)">View Profile Card</button>
                        <button type="button" class="dropdown-action-item" role="menuitem" onclick="portalDesktopCommanderMenuAction('edit-profile', event)">Edit Profile</button>
                        <button type="button" id="nav-dropdown-messages-btn" class="dropdown-action-item dropdown-action-item-messages" role="menuitem" onclick="portalDesktopCommanderMenuAction('messages', event)">
                            <span class="dropdown-messages-label">Messages</span>
                            <span id="nav-messages-unread-count" class="dropdown-messages-unread-count" hidden></span>
                        </button>
                        <button type="button" class="dropdown-action-item" role="menuitem" onclick="portalDesktopCommanderMenuAction('settings', event)">Settings</button>
                        <button type="button" id="game-nav-dropdown-return-portal-btn" class="dropdown-action-item dropdown-action-item-return-portal" role="menuitem" onclick="portalDesktopCommanderMenuAction('return-to-portal', event)">Return to Age Portal</button>
                        <button type="button" id="game-nav-dropdown-logout-btn" class="dropdown-action-item dropdown-action-item-logout" role="menuitem" onclick="portalDesktopCommanderMenuAction('logout', event)">Log Out</button>
                    </div>
                </div>
                </div>
            </div>

            <div class="portal-mobile-nav-bar-clip">
                <nav class="main-portal-nav-bar game-page-nav-bar" id="game-navigation-chassis" aria-label="Game navigation">

                    <div class="portal-mobile-nav-shell" id="game-mobile-nav-shell">
                        <button type="button" class="portal-mobile-nav-toggle" id="game-mobile-nav-toggle" aria-expanded="false" aria-controls="game-mobile-nav-menu">
                            <span class="portal-mobile-nav-toggle-label" id="game-mobile-nav-current-label">Overview</span>
                            <span class="portal-mobile-nav-chevron" aria-hidden="true">▾</span>
                        </button>
                        <div class="portal-mobile-nav-menu" id="game-mobile-nav-menu" hidden inert>
                            <div class="portal-mobile-nav-menu-sticky-head">
                                <div class="portal-mobile-commander-block" id="game-mobile-commander-block">
                                    <button type="button" class="portal-mobile-commander-trigger" id="game-mobile-commander-toggle" aria-expanded="false" aria-controls="game-mobile-commander-submenu" onclick="toggleGameMobileCommanderSubmenu(event)">
                                        <img class="portal-mobile-commander-avatar" id="game-mobile-nav-avatar" src="images/avatars/commanderprofile01.png" alt="">
                                        <span class="portal-mobile-commander-identity">
                                            <strong class="portal-mobile-commander-name" id="game-mobile-nav-username">Loading...</strong>
                                        </span>
                                        <span class="portal-mobile-nav-chevron portal-mobile-commander-chevron" aria-hidden="true">▾</span>
                                    </button>
                                    <div class="portal-mobile-commander-submenu" id="game-mobile-commander-submenu" hidden>
                                        <button type="button" class="portal-mobile-submenu-item" onclick="gameMobileNavCommanderAction('view-profile', event)">View Profile Card</button>
                                        <button type="button" class="portal-mobile-submenu-item" onclick="gameMobileNavCommanderAction('edit-profile', event)">Edit Profile</button>
                                        <button type="button" class="portal-mobile-submenu-item portal-mobile-submenu-item-messages" id="game-mobile-messages-btn" onclick="gameMobileNavCommanderAction('messages', event)">
                                            <span class="dropdown-messages-label">Messages</span>
                                            <span id="game-mobile-messages-unread" class="dropdown-messages-unread-count" hidden></span>
                                        </button>
                                        <button type="button" class="portal-mobile-submenu-item" onclick="gameMobileNavCommanderAction('settings', event)">Settings</button>
                                        <button type="button" id="game-mobile-dropdown-return-portal-btn" class="portal-mobile-submenu-item portal-mobile-submenu-item-return-portal" onclick="gameMobileNavCommanderAction('return-to-portal', event)">Return to Age Portal</button>
                                        <button type="button" id="game-mobile-dropdown-logout-btn" class="portal-mobile-submenu-item portal-mobile-submenu-item-logout" onclick="gameMobileNavCommanderAction('logout', event)">Log Out</button>
                                    </div>
                                </div>
                            </div>
                            <div class="portal-mobile-nav-menu-scroll">
                                <nav class="portal-mobile-nav-pages" id="game-mobile-nav-pages" aria-label="Game sections">
                                    <button type="button" class="portal-mobile-nav-page-item is-active" data-game-view="overview">Overview</button>
                                    <button type="button" class="portal-mobile-nav-page-item" data-game-view="city">City</button>
                                    <button type="button" class="portal-mobile-nav-page-item" data-game-view="map">Map</button>
                                </nav>
                            </div>
                        </div>
                    </div>

                    <div class="nav-tabs-centered-flex-dock portal-desktop-nav-only game-page-nav-tabs">
                        <div class="nav-tab active" data-game-view="overview" role="button" tabindex="0">Overview</div>
                        <div class="nav-tab" data-game-view="city" role="button" tabindex="0">City</div>
                        <div class="nav-tab" data-game-view="map" role="button" tabindex="0">Map</div>
                    </div>

                </nav>
            </div>
        </div>
    </div>

    <main class="game-page-main">
        <section class="game-page-view game-page-view--overview is-active" data-game-view="overview" aria-label="Overview">
            <section class="game-page-class-modal-stage" aria-label="Choose your class">
                <div id="game-class-picker" class="game-class-picker">
                    <!-- Character mask coordinates: edit CHARACTER_MASKS in game-class-picker.js -->
                    <img
                        src="images/chooseclasstitle.png"
                        alt="Choose Your Class"
                        class="game-class-picker-title"
                    >

                    <div class="game-class-picker-artboard">
                        <img
                            src="images/chooseclass.png"
                            alt="Choose your class — four commanders in a stone hall"
                            class="game-class-picker-base"
                            width="2752"
                            height="1536"
                        >

                        <div class="game-class-picker-characters" aria-hidden="true">
                            <div class="game-class-character" data-character-id="mage">
                                <img src="images/chooseclass.png" alt="">
                            </div>
                            <div class="game-class-character" data-character-id="sorceress">
                                <img src="images/chooseclass.png" alt="">
                            </div>
                            <div class="game-class-character" data-character-id="knight">
                                <img src="images/chooseclass.png" alt="">
                            </div>
                            <div class="game-class-character" data-character-id="soldier">
                                <img src="images/chooseclass.png" alt="">
                            </div>
                        </div>

                        <svg
                            class="game-class-picker-hitmap"
                            viewBox="0 0 2752 1536"
                            preserveAspectRatio="xMidYMid meet"
                            role="group"
                            aria-label="Select a character"
                        >
                            <polygon class="game-class-hit-zone" data-character-id="mage" points="" tabindex="0" role="button" aria-label="Left Mage" aria-pressed="false"></polygon>
                            <polygon class="game-class-hit-zone" data-character-id="sorceress" points="" tabindex="0" role="button" aria-label="Middle-Left Sorceress" aria-pressed="false"></polygon>
                            <polygon class="game-class-hit-zone" data-character-id="knight" points="" tabindex="0" role="button" aria-label="Middle-Right Knight" aria-pressed="false"></polygon>
                            <polygon class="game-class-hit-zone" data-character-id="soldier" points="" tabindex="0" role="button" aria-label="Right Soldier" aria-pressed="false"></polygon>
                        </svg>
                    </div>
                </div>
            </section>
        </section>

        <section class="game-page-view game-page-view--city" data-game-view="city" aria-label="City" hidden>
            <p class="game-page-view-placeholder">City view coming soon.</p>
        </section>

        <section class="game-page-view game-page-view--map" data-game-view="map" aria-label="Map" hidden>
            <p class="game-page-view-placeholder">Map view coming soon.</p>
        </section>
    </main>

    <script src="dev-environment.js"></script>
    <script src="rift-error-codes.js?v=nexus-rift-acronyms-1"></script>
    <script src="portal-alerts.js?v=nexus-rift-acronyms-1"></script>
    <script src="rift-error-display.js?v=nexus-rift-acronyms-1"></script>
    <script src="commander-dossier-sync.js?v=dossier-sync-1"></script>
    <script src="script.js?v=mailbox-system-unread-bar-1"></script>
    <script src="portal-commander-identity-menu.js?v=avatar-name-menu-trigger-1"></script>
    <script src="game-class-picker.js?v=choose-class-characters-2"></script>
    <script src="game.js?v=choose-class-picker-1"></script>
    <script src="game-chat.js?v=error-codes-1"></script>
    <script src="dev-page-navigator.js?v=handoff-achievement-popup-1"></script>
    <script src="custom-cursor.js?v=scrollbar-cursor-2"></script>
</body>
</html>
